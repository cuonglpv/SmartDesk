      - profile.self
      x-implementation-status: PROPOSED
      responses:
        '204':
          description: Successful operation
          headers: &id002
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
        '401':
          $ref: '#/components/responses/Err401'
        '500':
          $ref: '#/components/responses/Err500'
      x-roles:
      - EMPLOYEE
      - IT_STAFF
      - IT_MANAGER
      - ORG_ADMIN
      x-data-scope: AUTHENTICATED_USER_IN_TENANT
      x-roles-description: Informational role visibility; actual authorization is x-permissions + tenant + ownership
        + state.
      description: Revokes the current session and its refresh token.
