    ProblemDetails:
      type: object
      additionalProperties: false
      description: RFC 9457 Problem Details (supersedes RFC 7807) with stable SmartDesk extensions. Never expose
        tenant IDs, credentials, KB snippets, internal notes or stack traces in errors.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Problem type URI; about:blank for generic HTTP problems.
        title:
          type: string
          description: Stable short summary for this problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status, matching the response status.
        detail:
          type: string
          description: Optional human-readable explanation; never parse this value in clients.
        instance:
          type: string
          description: Request occurrence reference without confidential identifying data.
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        traceId:
          type: string
          description: Opaque server correlation identifier; not a secret.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation-only field-to-messages map; absent for other errors.
      required:
      - type
      - title
      - status
      - errorCode
      - traceId
    ErrorCode:
      type: string
      description: Stable machine-readable SmartDesk error code. Clients branch on this value, never on detail.
      enum:
      - VALIDATION_FAILED
      - UNSUPPORTED_FILE_TYPE
      - AUTHENTICATION_FAILED
      - SESSION_EXPIRED
      - ACCESS_DENIED
      - TENANT_SUSPENDED
      - RESOURCE_NOT_FOUND
      - INVALID_TRANSITION
      - CONCURRENT_MODIFICATION
      - IDEMPOTENCY_KEY_REUSED
      - CATALOG_VERSION_STALE
      - APPROVAL_REQUIRED
      - ALREADY_DECIDED
      - ASSET_NOT_AVAILABLE
      - DUPLICATE_ASSET_TAG
      - LAST_ORG_ADMIN
      - FILE_NOT_READY
      - UPLOAD_TOO_LARGE
      - RATE_LIMIT_EXCEEDED
      - AI_UNAVAILABLE
      - INTERNAL_SERVER_ERROR
    PlatformSession:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresInSeconds:
          type: integer
          minimum: 1
      required:
      - accessToken
      - tokenType
      - expiresInSeconds
      description: Platform administration session (user_sessions.tenant_id IS NULL). Accepted only by /platform
        endpoints. The refresh token is the HttpOnly cookie sd_platform_refresh.
