x-pagination-convention:
  page: 1-based; default 1
  pageSize: default 20, maximum 100
  response: 'items plus pageInfo: page, pageSize, total, hasNext'
  emptyList: '200 items: [] (not 404)'
  accessPolicy: pagination is applied AFTER tenant and ownership authorization filtering
x-error-format: application/problem+json; RFC 9457 Problem Details with errorCode (#/components/schemas/ErrorCode),
  traceId and optional errors.
x-standard-headers:
  Authorization: Bearer <access token> held in memory by the SPA; /platform endpoints take a platform session instead.
    Never a client-chosen tenant ID. Refresh tokens are cookies, never headers or bodies.
  Idempotency-Key: Required for POST /tickets (16-100 characters); see the IdempotencyKey parameter.
  Idempotent-Replayed: Response header on a replayed POST /tickets.
  X-CSRF-Token: Required on /auth/refresh and /platform/auth/refresh; equals the sd_csrf cookie (double submit).
