components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-JWT
      description: Short-lived authenticated, tenant-scoped access token. No client-chosen tenant header.
    PlatformSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-JWT
      description: Platform Admin session from /platform/auth/sign-in. Not accepted by tenant endpoints, and SessionBearer
        is not accepted by /platform endpoints.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: sd_refresh
      description: HttpOnly; Secure; SameSite=Strict; Path=/v1/auth. Opaque, single-use, rotated on every refresh;
        stored only as user_sessions.refresh_token_hash. Never readable by JavaScript.
    PlatformRefreshCookie:
      type: apiKey
      in: cookie
      name: sd_platform_refresh
      description: HttpOnly; Secure; SameSite=Strict; Path=/v1/platform/auth. Same rules as sd_refresh, for platform
        sessions only.
  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalRuleId:
      name: approvalRuleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SlaPolicyId:
      name: slaPolicyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestTypeId:
      name: requestTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 100
      description: 'Scope tenant + actor + method + path, kept at least 24 h with the request hash and the first
        response (idempotency_records). Same key and same payload replays the first response with Idempotent-Replayed:
        true; a different payload returns 409 IDEMPOTENCY_KEY_REUSED.'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: 'Double-submit token: must equal the sd_csrf cookie (Secure; SameSite=Strict; not HttpOnly, so
        the SPA can read it). Required on every request that a refresh cookie authenticates.'
  responses:
    Err400:
      description: Input or validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/ValidationProblem'
    Err401:
      description: Missing/invalid credentials or inactive account
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/UnauthorizedProblem'
    Err403:
      description: Permission denied or tenant suspended for write
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/ForbiddenProblem'
    Err404:
      description: Not found or not visible, including cross-tenant record
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/NotFoundProblem'
    Err409:
      description: Invalid state transition, version conflict, duplicate or idempotency mismatch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/ConflictProblem'
    Err413:
      description: Request entity too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/TooLargeProblem'
    Err429:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/RateLimitProblem'
      headers:
        Retry-After:
          description: Seconds until client may retry, when available.
          schema:
            type: integer
            minimum: 1
    Err500:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/InternalProblem'
    Err503:
      description: AI provider unavailable or exceeded the server time budget; no answer was invented
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standard:
              $ref: '#/components/examples/AiUnavailableProblem'
      headers:
        Retry-After:
          description: Seconds until the client may retry, when known.
          schema:
            type: integer
            minimum: 1
  schemas:
    Role:
      type: string
      enum:
      - EMPLOYEE
      - IT_STAFF
      - IT_MANAGER
      - ORG_ADMIN
      description: Tenant role (role_code). Platform administration is not a tenant role; it is a separate platform
        session (users.is_platform_admin).
    TicketType:
      type: string
      enum:
      - INCIDENT
      - SERVICE_REQUEST
      - CHANGE
    Priority:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    TicketStatus:
      type: string
      enum:
      - SUBMITTED
      - TRIAGED
      - IN_PROGRESS
      - WAITING_FOR_EMPLOYEE
      - PENDING_APPROVAL
      - APPROVED
      - IN_FULFILMENT
      - RESOLVED
      - REOPENED
      - CLOSED
      - REJECTED
      - CANCELLED
      - DRAFT
      - ASSESSING
      - SCHEDULED
      - IMPLEMENTED
      description: Wire enum for all kinds; the valid subset per kind is x-allowed-by-kind (ck_tickets_status_per_kind).
      x-allowed-by-kind:
        INCIDENT:
        - SUBMITTED
        - TRIAGED
        - IN_PROGRESS
        - WAITING_FOR_EMPLOYEE
        - RESOLVED
        - REOPENED
        - CLOSED
        - CANCELLED
        SERVICE_REQUEST:
        - SUBMITTED
        - PENDING_APPROVAL
        - APPROVED
        - REJECTED
        - IN_FULFILMENT
        - RESOLVED
        - CLOSED
        - CANCELLED
        CHANGE:
        - DRAFT
        - ASSESSING
        - PENDING_APPROVAL
        - SCHEDULED
        - IMPLEMENTED
        - REJECTED
        - CLOSED
        - CANCELLED
    AssetStatus:
      type: string
      enum:
      - AVAILABLE
      - ASSIGNED
      - IN_MAINTENANCE
      - RETIRED
      - LOST
      description: asset_status. ASSIGNED is set only by handover; a returned device is AVAILABLE again (RETURNED
        is an assignment event, not an asset state).
    KBStatus:
      type: string
      enum:
      - DRAFT
      - IN_REVIEW
      - PUBLISHED
      - RETIRED
    TenantStatus:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
    Plan:
      type: string
      enum:
      - STARTER
      - PRO
      - ENTERPRISE
    RequestCategory:
      type: string
      enum:
      - REPORT_PROBLEM
      - REQUEST_SOMETHING
      - PROPOSE_CHANGE
    ArticleVisibility:
      type: string
      enum:
      - ALL_EMPLOYEES
      - IT_ONLY
      description: kb_visibility
    NotificationType:
      type: string
      enum:
      - TICKET
      - APPROVAL
      - ASSET
      - SLA
      - KNOWLEDGE_BASE
      - SYSTEM
    CommentVisibility:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
    ApprovalDecision:
      type: string
      enum:
      - APPROVE
      - REJECT
    Version:
      type: integer
      minimum: 0
      description: Monotonic resource revision (row_version), 0 on create; used for optimistic concurrency checks.
