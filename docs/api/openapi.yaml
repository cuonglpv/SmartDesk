x-ticket-state-machines:
  INCIDENT:
  - SUBMITTED -> TRIAGED
  - TRIAGED -> IN_PROGRESS (assigned)
  - IN_PROGRESS <-> WAITING_FOR_EMPLOYEE
  - IN_PROGRESS -> RESOLVED (resolutionNote)
  - RESOLVED -> CLOSED (requester confirms or 7-day job)
  - RESOLVED -> REOPENED (reason, within 7 days)
  - REOPENED -> IN_PROGRESS
  SERVICE_REQUEST:
  - SUBMITTED -> PENDING_APPROVAL (if required)
  - SUBMITTED -> IN_FULFILMENT (if not required)
  - PENDING_APPROVAL -> APPROVED | REJECTED
  - APPROVED -> IN_FULFILMENT
  - IN_FULFILMENT -> RESOLVED
  - RESOLVED -> CLOSED (confirm or timer)
  CHANGE:
  - DRAFT -> ASSESSING
  - ASSESSING -> PENDING_APPROVAL (impact, rollback, window complete)
  - PENDING_APPROVAL -> SCHEDULED | REJECTED
  - SCHEDULED -> IMPLEMENTED (manual work result recorded)
  - IMPLEMENTED -> CLOSED
  CANCELLED: Allowed for authorized actor in non-final ticket before work starts; IT must provide reason.
x-authorization-note: x-permissions lists eligible capabilities; entries separated in array are ANY-OF for endpoint
  access, but object-level ownership, tenant, workflow and action-specific extra permission checks are AND requirements.
  Role permission grants are defined in docs/02-use-cases.md.
