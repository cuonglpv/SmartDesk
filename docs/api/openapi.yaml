  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a tenant session
      operationId: refreshSession
      x-use-cases:
      - UC01
      x-release: P0
      x-permissions: []
      x-implementation-status: PROPOSED
      responses:
        '200':
          description: New access token; the refresh cookie is rotated.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSession'
        '401':
          $ref: '#/components/responses/Err401'
        '403':
          $ref: '#/components/responses/Err403'
        '429':
          $ref: '#/components/responses/Err429'
        '500':
          $ref: '#/components/responses/Err500'
      description: 'Authenticated only by the sd_refresh cookie plus X-CSRF-Token equal to the sd_csrf cookie (missing
        or different -> 403 ACCESS_DENIED). Issues a new access token and rotates the refresh cookie; the old refresh
        token is revoked. Re-use of a revoked refresh token revokes the whole session and clears the cookies (401).
        The SPA calls this with credentials: include; CORS allows only the SmartDesk web origin with credentials.
        Suspended tenant or locked membership returns 401.'
      security:
      - RefreshCookie: []
      x-roles: []
      x-data-scope: PRE_AUTH_OR_SESSION
      x-roles-description: Informational role visibility; actual authorization is x-permissions + tenant + ownership
        + state.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /auth/sign-out:
    post:
      tags:
      - Authentication
      summary: Revoke the current session
      operationId: signOut
      x-use-cases:
      - UC01
      x-release: P0
