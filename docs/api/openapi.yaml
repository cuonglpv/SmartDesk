openapi: 3.1.0
info:
  title: SmartDesk API — Proposed Contract
  version: 0.4.1-draft
  summary: Design-only OpenAPI 3.1 contract for SmartDesk; no backend implementation exists yet.
  description: 'Status: DESIGN CONTRACT ONLY (0.4.1-draft, 2026-10-30; fixes from docs/api/openapi-review.md applied;
    D15 decided: refresh token only in an HttpOnly cookie). The referenced repository contains product requirements,
    diagrams and a mock-data UX prototype; it has no running backend/API implementation.


    Authentication: short-lived bearer sessions. Tenant is resolved ONLY from authenticated session claims, never
    a client-supplied header, route or payload. Platform sessions are isolated from tenant data endpoints. Authorization
    also checks role, permission, resource ownership and state on every request; unauthorized cross-tenant resources
    return 404. Every mutating call is audited.


    Concurrency: commands use expectedVersion and return 409 on stale version, as required by acceptance criteria.
    Ticket creation requires Idempotency-Key; store original response and payload hash for at least 24 hours.


    Lifecycle: INCIDENT / SERVICE_REQUEST / CHANGE use distinct transition graphs. Ticket closure is by requester
    confirmation or backend timer; IT may not force CLOSED. Resolving requires a note. Requests needing approval
    cannot be fulfilled without approval.


    AI: answers from published, visible tenant KB only, with valid citations; no evidence means NO_SOURCE. Assistant
    cannot submit tickets, approve requests, change assets or directly access DB. All draft submissions require
    explicit human POST /tickets.


    Open decisions tracked in accompanying review document: suspended-tenant sign-in (this draft rejects sign-in
    to match UC01, while AC-UC41 suggests read-only sign-in); exact delegated approver model; token/session transport;
    catalog change migration; and SLA rescheduling semantics.


    Documentation improvements based on the finance-manager repository (reference only): RFC 9457/RFC 7807-compatible
    Problem Details, high-level role metadata, reproducible examples, and an API usage/traceability guide. Server
    URLs are illustrative. Runtime response/error verification and conformance testing remain pending. For role
    authorization use x-permissions as the precise capability gate; x-roles is only coarse-grained discovery metadata.

    '
  contact:
    name: SmartDesk API Design
externalDocs:
  description: SmartDesk product source — use cases, acceptance criteria, IA and prototype
  url: https://github.com/cuonglpv/SmartDesk
