paths:
  /auth/sign-in:
    post:
      tags:
      - Authentication
      summary: Sign in or request tenant selection
      operationId: signIn
      x-use-cases:
      - UC01
      x-release: P0
      x-permissions: []
      x-implementation-status: PROPOSED
      responses:
        '200':
          description: Successful response. When a session is created, the refresh and CSRF cookies are set; a TENANT_SELECTION_REQUIRED
            result sets no cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
              examples:
                oneWorkspace:
                  value:
                    result: SIGNED_IN
                    session:
                      accessToken: opaque-session-example
                      tokenType: Bearer
                      expiresInSeconds: 900
                      tenantId: 11111111-1111-4111-8111-111111111111
                      roles:
                      - EMPLOYEE
                multipleWorkspaces:
                  value:
                    result: TENANT_SELECTION_REQUIRED
                    loginChallenge: one-use-challenge-example
                    expiresInSeconds: 300
                    tenants:
                    - id: 11111111-1111-4111-8111-111111111111
                      name: Company North
                    - id: 22222222-2222-4222-8222-222222222222
                      name: Company South
          headers: &id001
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '400':
          $ref: '#/components/responses/Err400'
        '401':
          $ref: '#/components/responses/Err401'
        '429':
          $ref: '#/components/responses/Err429'
        '500':
          $ref: '#/components/responses/Err500'
      description: Credentials checked before tenant choices are returned. Invalid credentials, locked accounts
        and (by design) suspended tenant logins yield generic 401. No refresh-token flow defined for MVP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInInput'
            example:
              email: employee@example.com
              password: example-password
      security: []
      x-roles: []
      x-data-scope: PRE_AUTH_OR_SESSION
      x-roles-description: Informational role visibility; actual authorization is x-permissions + tenant + ownership
        + state.
