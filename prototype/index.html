<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartDesk Prototype</title>
<style>
:root{--bg:#f4f6fa;--paper:#fff;--ink:#152443;--muted:#64748b;--line:#e3e8f0;--blue:#2f62c9;--nav:#162843;--green:#1f7a5c;--amber:#a86512;--red:#b4334a;--violet:#5b4bc4}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI','Noto Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #9cc0ff;outline-offset:2px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--nav);color:#eef3ff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;padding:4px 10px 22px}
.logo{display:grid;place-items:center;background:#5f86ed;border-radius:9px;width:32px;height:32px;font-size:17px}
.tenant{background:#22385a;border:1px solid #34507a;border-radius:10px;padding:11px 12px;margin-bottom:18px;font-size:13px}
.tenant small{display:block;color:#a6b8d4;margin-top:3px}
.navgroup{font-size:10.5px;text-transform:uppercase;letter-spacing:1.6px;color:#8ea6ca;margin:20px 12px 8px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;padding:10px 12px;text-align:left;background:transparent;color:#c8d5ea;border-radius:9px;margin:2px 0;text-decoration:none}
.nav:hover,.nav.active{background:#304a73;color:#fff}
.nav .ico{width:20px;text-align:center}
.nav .count{margin-left:auto;background:#4b6ea8;border-radius:20px;font-size:11px;padding:1px 8px}
.topbar{background:var(--paper);border-bottom:1px solid var(--line);height:64px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.crumbs{color:var(--muted);font-size:13px}
.topright{display:flex;align-items:center;gap:12px}
.search{width:260px}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px}
.bell b{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;border-radius:20px;padding:1px 6px}
.avatar{display:grid;place-items:center;background:#dce8fc;color:#2e5aa0;border-radius:50%;height:36px;width:36px;font-weight:800}
.role{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px}
.demo{white-space:nowrap;font-size:11px;font-weight:700;color:#8a5a12;background:#fff4dc;padding:5px 10px;border-radius:30px}
.main{max-width:1320px;margin:0 auto;padding:28px 32px 70px}
.overline{font-size:12px;font-weight:700;color:#5d7aa3;text-transform:uppercase;letter-spacing:1.2px;margin:0 0 6px}
h1{font-size:27px;margin:0 0 6px;letter-spacing:-.6px}
h2{font-size:16.5px;margin:0 0 12px}
h3{font-size:14.5px;margin:0 0 6px}
p{color:var(--muted);line-height:1.6;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 18px rgba(30,50,82,.04)}
.card+.card{margin-top:16px}.grid>.card+.card,.split>.card+.card,.assistant>.card+.card{margin-top:0}
.hero{background:linear-gradient(110deg,#eaf1ff,#fbfdff);border:1px solid #d6e3ff;padding:26px 28px;border-radius:16px;margin:4px 0 24px}
.hero h2{font-size:21px;margin-bottom:6px}
.askbar{display:flex;gap:10px;margin-top:14px;max-width:720px}
.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);padding:10px 16px;border-radius:9px;font-weight:650;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.sec{background:#fff;color:#2f5597;border-color:#cbd8ec}
.btn.ghost{background:#f3f5f9;color:var(--ink);border-color:#e0e5ed}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.ok{background:var(--green);border-color:var(--green)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.qa{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px;text-decoration:none;color:inherit}
.qa:hover{border-color:#93b2e6;background:#fbfdff}
.qa .ic{font-size:21px;display:grid;place-items:center;background:#ecf2ff;color:#41659f;width:42px;height:42px;border-radius:11px;margin-bottom:12px}
.qa strong{display:block;margin-bottom:4px}
.qa span{color:var(--muted);font-size:12.5px}
.pill{font-size:11.5px;border-radius:50px;padding:3px 9px;font-weight:700;display:inline-block;background:#e8efff;color:#2f5597;white-space:nowrap}
.pill.green{background:#e0f4ea;color:#17694f}.pill.amber{background:#fff1d9;color:#8c5711}.pill.red{background:#ffe6ea;color:#a12a42}.pill.grey{background:#eef1f5;color:#4b5a70}.pill.violet{background:#efecff;color:#4c3db0}
.field{border:1px solid #d3ddeb;border-radius:9px;padding:10px 12px;background:#fff;width:100%;outline:none}
.field:focus{border-color:#5788d8;box-shadow:0 0 0 3px #dbe8fc}
.field.invalid{border-color:var(--red)}
.err{color:var(--red);font-size:12.5px;margin-top:5px}
.frow{margin:13px 0}
.frow label{display:block;font-weight:650;margin-bottom:6px}
.frow small{color:var(--muted)}
textarea.field{min-height:90px;resize:vertical}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:#66778e;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:#f8fafc}
th,td{padding:12px;border-bottom:1px solid #e9edf3}
tbody tr{cursor:pointer}tbody tr:hover{background:#f7faff}
tr:last-child td{border-bottom:0}
.tid{font-weight:700;color:#3a5f98;font-size:12.5px;white-space:nowrap}
.tiny{color:var(--muted);font-size:12.5px}
.meta{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;margin:8px 0}
.meta span{color:var(--muted)}
.timeline{border-left:2px solid #dde5f1;margin:10px 0 0 8px;padding-left:20px}
.ev{position:relative;padding:2px 0 16px}
.ev:before{content:"";position:absolute;top:6px;left:-27px;width:10px;height:10px;border-radius:50%;background:#6d93d6;border:3px solid #fff}
.ev.internal:before{background:var(--amber)}
.ev small{display:block;color:#8392a7}
.ev .note{background:#f6f8fb;border-radius:9px;padding:9px 11px;margin-top:5px;color:#334155}
.ev.internal .note{background:#fff7e8}
.steps{display:flex;gap:0;margin:14px 0 4px}
.step{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:24px}
.step:before{content:"";position:absolute;top:7px;left:0;right:0;height:3px;background:#e3e9f2}
.step:after{content:"";position:absolute;top:2px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#e3e9f2}
.step.done:before,.step.done:after{background:var(--green)}
.step.now{color:var(--ink);font-weight:700}.step.now:before{background:linear-gradient(90deg,var(--green) 50%,#e3e9f2 50%)}.step.now:after{background:var(--blue);box-shadow:0 0 0 4px #dbe7ff}
.assistant{display:grid;grid-template-columns:minmax(0,1.55fr) 360px;gap:18px;align-items:start}
.chat{display:flex;flex-direction:column;height:640px;padding:0}
.chathead{padding:16px 20px;border-bottom:1px solid var(--line)}
.chatbody{padding:18px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1}
.bubble{max-width:86%;border-radius:14px;padding:11px 14px;line-height:1.6}
.bubble.bot{background:#f2f6fc;border:1px solid #e4ebf6;align-self:flex-start}
.bubble.user{background:#2f62c9;color:#fff;align-self:flex-end}
.bubble ol{margin:6px 0 6px 18px;padding:0}
.cite{display:inline-flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;font-weight:700;color:#2f5597;background:#fff;border:1px solid #cddcf3;border-radius:20px;padding:3px 10px;text-decoration:none}
.nosrc{border-left:4px solid var(--amber)}
.chips{padding:8px 18px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.composer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px}
.draft{border:1.5px solid #8eb0ea;background:#f3f7ff;border-radius:14px;padding:16px}
.draft .item{display:flex;justify-content:space-between;gap:12px;margin:9px 0;font-size:13px}
.draft .item b{text-align:right}
.banner{border-radius:11px;padding:12px 14px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:#edf3ff;color:#294f8f}.banner.warn{background:#fff5e2;color:#7a4b0c}.banner.ok{background:#e6f6ee;color:#155e45}
.kpi .n{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-1px}
.bar{height:10px;border-radius:10px;background:#e8edf5;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart div{flex:1;background:#7da2e3;border-radius:6px 6px 0 0;position:relative}
.chart div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.wf{border:2px dashed #cfd9e8;border-radius:12px;padding:14px;background:#fafbfd}
.wf b{display:block;margin-bottom:3px}
.kbstep{display:flex;gap:12px;margin:12px 0}.kbstep b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e8efff;color:#2f5597;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:30px;padding:7px 13px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle button{border:0;background:#fff;padding:7px 12px}.toggle button.on{background:#fff2d6;color:#7a4b0c;font-weight:700}
.toggle button.on.pub{background:#e6eeff;color:#2f5597}
body.auth .sidebar,body.auth .topbar{display:none}body.auth .shell{grid-template-columns:1fr}body.auth .main{max-width:none;padding:0}
.auth-wrap{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.auth-intro{background:linear-gradient(150deg,#162843,#2a4f8f);color:#eef3ff;padding:56px 64px;display:flex;flex-direction:column;justify-content:center}
.auth-intro .brand{padding:0 0 40px}.auth-intro h1{font-size:38px;color:#fff;max-width:460px}.auth-intro p{color:#c7d6f0;font-size:16px;max-width:460px}
.auth-intro ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:12px;font-size:15px}
.auth-form{display:grid;place-items:center;padding:40px}.auth-form .card{width:100%;max-width:420px;padding:30px}
@media(max-width:800px){.auth-wrap{grid-template-columns:1fr}.auth-intro{padding:32px 20px}}
.toast{position:fixed;bottom:24px;right:28px;background:#1d3a60;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px #1a304c40;display:none;max-width:380px}
.empty{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:1100px){.shell{grid-template-columns:68px 1fr}.sidebar .lbl,.navgroup,.brand span:last-child,.tenant,.nav .count{display:none}.nav{justify-content:center}.assistant,.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.search{display:none}}
@media(max-width:640px){.main{padding:16px}.topbar{padding:0 14px}.g4,.g3,.g2{grid-template-columns:1fr}.demo{display:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="logo">◈</span><span>SmartDesk</span></div>
    <div class="tenant">Acme Technology<small>Workspace · 180 members</small></div>
    <nav id="nav" aria-label="Main"></nav>
  </aside>
  <div>
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="topright">
        <input class="field search" placeholder="Search tickets, articles, assets…" aria-label="Search">
        <span class="demo">PROTOTYPE · MOCK DATA</span>
        <button class="bell" aria-label="Notifications" onclick="toast('Notification Center (SCR-03) is specified in the IA')">🔔<b>3</b></button>
        <select class="role" id="role" aria-label="Switch role for the demo">
          <option value="employee">Employee</option>
          <option value="staff">IT Staff</option>
          <option value="manager">IT Manager</option>
        </select>
        <div class="avatar" id="avatar">AN</div>
      </div>
    </header>
    <main class="main" id="app"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ---------------------------------------------------------------- data */
const ME = 'An Nguyen';
const db = {
  seq: 1050,
  tickets: [
    {id:'INC-1042', type:'Incident', service:'VPN', title:'VPN cannot connect on macOS', status:'In Progress', priority:'High', requester:ME, dept:'Sales', assignee:'Hoang Minh', team:'Network', asset:'MBA-014', due:'3h 10m left', sla:'amber',
     desc:'Since this morning the VPN client shows "Authentication timed out". I followed KB-024 but it still fails.', fields:{'Operating system':'macOS 14','Error message':'Authentication timed out'},
     events:[{t:'Today 08:45',who:ME,text:'Ticket created from the AI Assistant draft'},{t:'09:05',who:'Hoang Minh',text:'Picked up the ticket · priority set to High'},{t:'09:20',who:'Hoang Minh',text:'MFA token for this user was revoked during the policy update; re-issuing.',internal:true},{t:'09:30',who:'Hoang Minh',text:'We are checking your VPN account. Please do not reinstall the client yet.'}]},
    {id:'SR-1038', type:'Service Request', service:'Laptop', title:'New laptop for a new sales hire', status:'Pending Approval', priority:'Medium', requester:ME, dept:'Sales', assignee:'—', team:'Service Desk', due:'Needed by 05 Nov', sla:'blue',
     desc:'New sales executive starts on 05 Nov and needs a standard laptop.', fields:{'Recipient':'Bao Tran','Needed by':'05 Nov 2026','Configuration':'Standard (14", 16 GB)'},
     events:[{t:'Yesterday 16:10',who:ME,text:'Request submitted from the Service Catalog'},{t:'16:10',who:'System',text:'Waiting for approval by IT Manager'}]},
    {id:'INC-1016', type:'Incident', service:'Printer', title:'3rd-floor printer is offline', status:'Resolved', priority:'Low', requester:ME, dept:'Sales', assignee:'Le Thu', team:'Service Desk', due:'Met', sla:'green',
     desc:'The printer next to the sales room does not show up on my laptop.', fields:{'Location':'HQ · Floor 3'}, resolution:'Replaced the toner and re-added the printer queue on the print server.',
     events:[{t:'Mon 10:02',who:ME,text:'Ticket created'},{t:'Mon 10:30',who:'Le Thu',text:'Picked up the ticket'},{t:'Mon 11:15',who:'Le Thu',text:'Resolved: Replaced the toner and re-added the printer queue on the print server.'}]},
    {id:'SR-1031', type:'Service Request', service:'VPN access', title:'VPN access for a finance contractor', status:'Pending Approval', priority:'Medium', requester:'Lan Pham', dept:'Finance', assignee:'—', team:'Network', due:'Needed by 01 Nov', sla:'blue',
     desc:'External auditor needs VPN access for two weeks.', fields:{'Who needs access':'Minh Do (contractor)','Access until':'15 Nov 2026'}, events:[{t:'Yesterday 09:40',who:'Lan Pham',text:'Request submitted'}]},
    {id:'INC-1047', type:'Incident', service:'Wi-Fi', title:'Wi-Fi drops in meeting room B', status:'Submitted', priority:'—', requester:'Bao Tran', dept:'Marketing', assignee:'Unassigned', team:'Network', due:'7h 40m left', sla:'blue',
     desc:'Video calls drop every few minutes in room B.', fields:{'Location':'HQ · Floor 2 · Room B'}, events:[{t:'Today 10:12',who:'Bao Tran',text:'Ticket created'}]},
  ],
  assets: [
    {tag:'MBA-014', model:'MacBook Air M2 13"', type:'Laptop', status:'Assigned', holder:ME, loc:'HQ', since:'12 Mar 2026'},
    {tag:'LT-221', model:'Dell Latitude 5440 14"', type:'Laptop', status:'Available', holder:'—', loc:'HQ store'},
    {tag:'LT-222', model:'Dell Latitude 5440 14"', type:'Laptop', status:'Available', holder:'—', loc:'HQ store'},
    {tag:'LT-205', model:'Lenovo ThinkPad T14', type:'Laptop', status:'Maintenance', holder:'—', loc:'Repair'},
    {tag:'MON-031', model:'Dell 24" monitor', type:'Monitor', status:'Assigned', holder:ME, loc:'HQ', since:'12 Mar 2026'},
  ],
  kb: [
    {id:'KB-024', title:'Connect to the company VPN', topic:'Network', summary:'Install the client, sign in with MFA and fix common errors.', steps:['Check that you have Internet access without the VPN.','Open the VPN client and sign in with your work email.','Approve the MFA prompt on your phone within 30 seconds.','If you see "Authentication timed out", quit the client and sign in again.','Still failing? Open a VPN incident with your OS and the exact error.']},
    {id:'KB-041', title:'Add an office printer', topic:'Printing', summary:'Find the printer near you and install the driver.', steps:['Open Settings › Printers.','Choose "Add printer" and pick the printer named after your floor.','Print a test page.']},
    {id:'KB-007', title:'Sign in to company email (SSO)', topic:'Accounts', summary:'Outlook and webmail sign-in with single sign-on.', steps:['Go to mail.acme.example and choose "Sign in with SSO".','Use your work email and approve MFA.']},
    {id:'KB-052', title:'Fix unstable Wi-Fi on laptops', topic:'Network', summary:'Forget the network, reconnect and update the driver.', steps:['Forget the "Acme-Staff" network.','Reconnect and accept the certificate.','Restart the laptop if the drops continue.']},
  ],
  approvals: [{id:'SR-1012', title:'Monitor for a designer', by:'IT Manager', decision:'Approved', t:'Mon'}],
};
const ui = {chat:[{who:'bot',html:'Hi An! I answer from Acme\'s published IT guides and can prepare a ticket for you. I never submit anything without your confirmation.'}], ai:{stage:null, draft:null}, approvalSel:'SR-1038', noteMode:'public', errors:{}, queueView:'All'};

/* ---------------------------------------------------------------- helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const go = h => { location.hash = h; };
const ticket = id => db.tickets.find(t => t.id === id);
const kb = id => db.kb.find(k => k.id === id);
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3200)}
function statusPill(s){const c={'Submitted':'grey','Triaged':'grey','In Progress':'','Waiting for Employee':'amber','Pending Approval':'amber','Approved':'violet','In Fulfilment':'','Resolved':'green','Closed':'grey','Rejected':'red','Reopened':'red'}[s];return `<span class="pill ${c??''}">${esc(s)}</span>`}
function prioPill(p){return `<span class="pill ${{High:'red',Medium:'amber',Low:'grey'}[p]||'grey'}">${esc(p==='—'?'Not set':p)}</span>`}
function head(over,title,sub){return `<div class="overline">${over}</div><h1>${title}</h1><p class="sub">${sub}</p>`}
function addEvent(t,who,text,internal){t.events.push({t:'Just now',who,text,internal:!!internal})}
function newId(prefix){return `${prefix}-${++db.seq}`}

/* ---------------------------------------------------------------- navigation */
const NAV = {
  employee:[['Workspace',[['#/app','⌂','Home'],['#/app/assistant','✦','AI Assistant'],['#/app/catalog','▦','Service Catalog'],['#/app/requests','≡','My Requests'],['#/app/kb','▤','Knowledge Base'],['#/app/assets','▣','My Assets']]]],
  staff:[['IT Workspace',[['#/it','⌂','Dashboard'],['#/it/tickets','≡','Ticket Queue',()=>db.tickets.filter(t=>t.assignee==='Unassigned').length],['#/it/assets','▣','Asset Inventory'],['#/it/kb','✎','KB Editor']]],['Self-service',[['#/app','☺','Employee Portal']]]],
  manager:[['Manager Console',[['#/manage/approvals','✓','Approvals',()=>db.tickets.filter(t=>t.status==='Pending Approval').length],['#/manage/reports','▥','SLA & Reports'],['#/manage/sla','⏱','SLA Policies'],['#/manage/kb','▤','KB Review']]],['IT Workspace',[['#/it/tickets','≡','Ticket Queue'],['#/it/assets','▣','Asset Inventory']]]],
};
function renderNav(path){
  const groups=NAV[ui.role];
  $('#nav').innerHTML=groups.map(([g,items])=>`<div class="navgroup">${g}</div>`+items.map(([h,i,l,c])=>{const on=('#'+path)===h||(h!=='#/app'&&h!=='#/it'&&('#'+path).startsWith(h+'/'));const n=c?c():0;return `<a class="nav ${on?'active':''}" href="${h}"><span class="ico">${i}</span><span class="lbl">${l}</span>${n?`<span class="count">${n}</span>`:''}</a>`}).join('')).join('')
    +`<div class="navgroup">Account</div><a class="nav ${path==='/profile'?'active':''}" href="#/profile"><span class="ico">⚙</span><span class="lbl">My Profile</span></a><a class="nav" href="#/login"><span class="ico">⎋</span><span class="lbl">Sign out</span></a>`;
  $('#role').value=ui.role; $('#avatar').textContent={employee:'AN',staff:'HM',manager:'QL'}[ui.role];
}

/* ---------------------------------------------------------------- employee pages */
function home(){
  const mine=db.tickets.filter(t=>t.requester===ME), pending=mine.filter(t=>t.status==='Resolved');
  return head('Employee Portal','Good morning, An 👋','Ask a question, request something, or follow up on your tickets.')+`
  <div class="hero"><h2>What do you need help with today?</h2><p>Answers come only from Acme's published IT guides, with the source shown.</p>
    <form class="askbar" onsubmit="event.preventDefault();ask(this.q.value);go('#/app/assistant')"><input name="q" class="field" placeholder="e.g. My VPN says authentication timed out" aria-label="Ask SmartDesk"><button class="btn">✦ Ask</button><a class="btn sec" href="#/app/catalog">Browse catalog</a></form></div>

  if(/vpn/.test(low)){

  ui.chat.push({who:'bot',cls:'nosrc',html:'I could not find a published Acme guide that answers this, so I will not guess.<div class="row mt"><a class="btn sm sec" href="#/app/catalog">Browse the catalog</a><button class="btn sm" onclick="aiGeneric()">Draft a ticket</button></div>'});

  nosource:()=>ask('Can I expense a home router?'),
  status:()=>ask('Where is my ticket INC-1042?'),
  invalid:()=>setTimeout(()=>{document.querySelector('form.card [name=Recipient]').value='';document.querySelector('form.card').requestSubmit()}),
  resolve:()=>setTimeout(()=>{const s=$('#st');s.value='Resolved';s.onchange();saveTicket('INC-1042')}),
  internal:()=>{ui.noteMode='internal'},
  reject:()=>setTimeout(()=>decide('SR-1038',false)),
  approve:()=>setTimeout(()=>{$('#dec').value='Approved for the new hire. Standard configuration is fine.';decide('SR-1038',true)}),
  approved:()=>{const t=ticket('SR-1038');t.status='Approved';t.approvedBy='Quang Le';t.assignee='Hoang Minh';addEvent(t,'Quang Le (IT Manager)','Approved')},
  signinerror:()=>{ui.login={email:'an@acme.example',error:'Email or password is incorrect, or this account cannot sign in right now.'}},
  company:()=>{ui.login={email:'an@acme.example',companies:LOGINS['an@acme.example'][1]}},
  profileerror:()=>setTimeout(()=>{$('#p_phone').value='call me';document.querySelector('form.card').requestSubmit()}),
};
let lastPath='';
function render(){
  const [path,qs]=(location.hash.slice(1)||'/login').split('?'), q=new URLSearchParams(qs||'');
  if(path!==lastPath){ui.errors={};ui.formData=null;lastPath=path}
  if(q.get('role'))ui.role=q.get('role');
  else if(path.startsWith('/manage'))ui.role='manager'; else if(path.startsWith('/it')&&ui.role==='employee')ui.role='staff'; else if(path.startsWith('/app'))ui.role='employee';
  if(q.get('demo')&&!ui.demo&&DEMOS[q.get('demo')]){ui.demo=1;DEMOS[q.get('demo')]()}
  document.body.classList.toggle('auth',path==='/login');
  if(path==='/login'){$('#app').innerHTML=login();return}
  renderNav(path);
  let html=null,label='';
  for(const[re,fn,l] of ROUTES){const m=path.match(re);if(m){html=fn(m[1]);label=l;break}}
  if(html===null&&SPEC[path]){html=spec(path);label=SPEC[path][1]}
  $('#app').innerHTML=html??notFound();
  $('#crumbs').textContent='SmartDesk / '+{employee:'Employee Portal',staff:'IT Workspace',manager:'Manager Console'}[ui.role]+' / '+(label||'Not found');
  const cb=$('#chatbody'); if(cb)cb.scrollTop=cb.scrollHeight;
}
$('#role').addEventListener('change',e=>{ui.role=e.target.value;go({employee:'#/app',staff:'#/it',manager:'#/manage/approvals'}[ui.role]);render()});
window.addEventListener('hashchange',render);
ui.role='employee'; ui.login=null; render();
</script>
</body>
